spring:
  application:
    name: life-plan-backend

  # 默认使用MySQL数据库
  profiles:
    active: mysql

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api


logging:
  level:
    com.lifeplan.mapper: debug
    org.springframework.web: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
